    border-top: 0.5px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    padding: 0 16px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .img-toolbar button {
    height: 34px;
    padding: 0 14px;
    border-radius: 9px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 0.5px solid rgba(255,255,255,0.12);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, transform 0.08s;
  }
  .img-toolbar button:hover { background: rgba(255,255,255,0.18); }
  .img-toolbar button:active { transform: scale(0.96); }
  .img-toolbar button.primary {
    background: var(--accent);
    border-color: var(--accent);
  }
  .img-toolbar button.primary:hover { background: #6a8a5e; }
  .img-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .img-toolbar-sep {
    width: 1px; height: 22px;
    background: rgba(255,255,255,0.18);
    margin: 0 4px;
  }
  .img-hint {
    color: rgba(255,255,255,0.75);
    font-size: 12.5px;
    font-style: italic;
  }

  /* Dropdowns */
  .dropdown-backdrop {
    position: fixed; inset: 0; z-index: 50;
  }

  .view-spotlight-backdrop {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(8,10,8,0.32);
    backdrop-filter: blur(8px) saturate(140%);
    -webkit-backdrop-filter: blur(8px) saturate(140%);
    animation: spotlight-fade 0.16s ease-out;
  }

  .cal-btn {
    border: 1px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.6);
    color: inherit; border-radius: 8px; min-width: 30px; height: 30px;
    padding: 0 10px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .cal-btn:hover { background: rgba(0,0,0,0.06); }
  .macwin.dark .cal-btn { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
  .macwin.dark .cal-btn:hover { background: rgba(255,255,255,0.12); }
  .cal-btn svg { display: block; }

  /* Pending reminders strip — the rows behind the titlebar badge count. */

  .cal-del { color: #b3463f; }

  /* F5 — click a TD opens the row editor focused on that column. */
  .md-render table.md-table > tbody > tr > td { cursor: pointer; }
  .md-render table.md-table > tbody > tr > td:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .macwin.dark .md-render table.md-table > tbody > tr > td:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  /* F2 — in-app reminder toast that fires alongside the OS notification. */
  .reminder-banner {
    position: fixed; right: 20px; bottom: 20px; z-index: 95;
    width: 320px;
    /* Theme-driven surface so the toast matches whatever palette is active
       (sage / cream / paper / sky / rose / graphite) instead of a hardcoded
       white box that clashes on tinted + dark themes. */
    background: var(--toolbar, #fff);
    color: var(--fg, #1c1f17);
    border: 1px solid color-mix(in srgb, var(--fg, #000) 14%, transparent);
    border-radius: 12px;
    box-shadow: 0 14px 38px rgba(0,0,0,0.18);
    padding: 12px 14px; font-size: 12.5px;
    animation: spotlight-fade 180ms ease;
  }
  .reminder-banner-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .reminder-banner-icon { display: inline-flex; color: var(--accent); }
  .reminder-banner-icon svg { width: 16px; height: 16px; display: block; }
  .reminder-banner-title { flex: 1; font-weight: 600; }
  .reminder-banner-x { background: none; border: 0; font-size: 16px; line-height: 1; color: inherit; opacity: 0.6; cursor: pointer; display: inline-flex; padding: 2px; border-radius: 4px; }
  .reminder-banner-x:hover { opacity: 1; }
  .reminder-banner-x svg { width: 13px; height: 13px; display: block; }
  .reminder-banner-when { opacity: 0.7; margin-bottom: 8px; }
  .reminder-banner-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .reminder-banner-actions .cal-btn { height: 26px; padding: 0 10px; font-size: 12px; }
  .reminder-banner-actions .reminder-banner-done { display: inline-flex; align-items: center; gap: 4px; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .reminder-banner-actions .reminder-banner-done:hover { filter: brightness(1.06); }
  .reminder-banner-actions .reminder-banner-done svg { width: 12px; height: 12px; display: block; }

  /* ── Reply / mention toasts (bottom-right) ─────────────────────────
     Theme-driven surface + accent edge, same family as .reminder-banner. */
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  .reply-toasts {
    position: fixed; right: 16px; bottom: 16px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 9000; max-width: 340px;
    pointer-events: none;
  }
  .reply-toast {
    pointer-events: auto; cursor: pointer;
    background: var(--toolbar, #fff); color: var(--fg, #1c1f17);
    border: 1px solid color-mix(in srgb, var(--fg, #000) 14%, transparent);
    border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 10px 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.22);
    font-size: 13px; line-height: 1.45;
    animation: toast-in 0.18s ease-out;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .reply-toast:hover { transform: translateY(-1px); box-shadow: 0 14px 36px rgba(0,0,0,0.28); }
  .reply-toast-head { display: flex; align-items: center; gap: 7px; }
  .reply-toast-ico { display: inline-flex; color: var(--accent); flex-shrink: 0; }
  .reply-toast-ico svg { width: 14px; height: 14px; display: block; }
  .reply-toast-who { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reply-toast-x {
    border: 0; background: transparent; color: inherit;
    opacity: 0.55; cursor: pointer;
    display: inline-flex; padding: 2px; border-radius: 4px;
    flex-shrink: 0;
  }
  .reply-toast-x:hover { opacity: 1; }
  .reply-toast-x svg { width: 12px; height: 12px; display: block; }
  .reply-toast-note { opacity: 0.7; font-size: 12px; margin-top: 2px; }
  .reply-toast-preview {
    opacity: 0.85; margin-top: 4px;
    overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  @keyframes spotlight-fade { from { opacity: 0; } to { opacity: 1; } }
  .view-menu {
    position: fixed;
    z-index: 80;
    left: 50%;
    top: 14vh;
    transform: translateX(-50%);
    width: min(720px, 92vw);
    max-height: 70vh;
    color: #1c1f17;
    background: rgba(247,246,240,0.96);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.5);
    border-radius: 16px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.45),
      0 10px 30px rgba(0,0,0,0.25),
      0 0 0 0.5px rgba(0,0,0,0.18) inset;
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: spotlight-pop 0.18s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @keyframes spotlight-pop {
    from { opacity: 0; transform: translateX(-50%) translateY(-8px) scale(0.985); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  .macwin.dark .view-menu {
    background: rgba(30,32,28,0.92);
    color: #e6e7e1;
    border-color: rgba(255,255,255,0.08);
  }
  .view-menu-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 6px 8px 8px;
  }
  .view-menu-footer {
    border-top: 0.5px solid rgba(0,0,0,0.1);
    padding: 8px 14px;
    display: flex;
    gap: 14px;
    font-size: 11px;
    color: #5d6452;
    flex-shrink: 0;
    background: rgba(0,0,0,0.02);
  }
  .view-menu-footer kbd {
    background: rgba(0,0,0,0.06);
    padding: 1px 6px;
    border-radius: 4px;
    font-family: ui-monospace, monospace;
    font-size: 10.5px;
    margin-right: 4px;
  }
  .macwin.dark .view-menu-footer { color: #9aa093; background: rgba(255,255,255,0.03); border-top-color: rgba(255,255,255,0.06); }
  .macwin.dark .view-menu-footer kbd { background: rgba(255,255,255,0.08); }

  /* Apply-template modal — small, compact, polished. */
  .apply-tpl-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.32);
    z-index: 200; backdrop-filter: blur(2px);
  }
  .apply-tpl-modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(480px, 92vw); max-height: 84vh; overflow: hidden;
    background: #f9f6ec; border-radius: 12px; z-index: 201;
    box-shadow: 0 24px 64px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.1);
    display: flex; flex-direction: column;
  }
  .apply-tpl-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-bottom: 0.5px solid rgba(0,0,0,0.08);
  }
  .apply-tpl-glyph {
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #c4e0a8, var(--accent));
    border-radius: 9px; font-size: 18px; flex-shrink: 0;
  }
  .apply-tpl-titles { flex: 1; min-width: 0; }
  .apply-tpl-title { font-size: 14px; font-weight: 600; color: #2a2f23; }
  .apply-tpl-sub { font-size: 11.5px; color: #6d745c; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .apply-tpl-close {
    width: 26px; height: 26px; border: 0; background: transparent;
    cursor: pointer; font-size: 18px; color: #6d745c; border-radius: 6px;
  }
  .apply-tpl-close:hover { background: rgba(0,0,0,0.08); color: #2a2f23; }
  .apply-tpl-body {
    padding: 14px 16px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  }
  .apply-tpl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .apply-tpl-field { display: flex; flex-direction: column; gap: 4px; }
  .apply-tpl-field > span {
    font-size: 10.5px; font-weight: 500; color: #6d745c;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .apply-tpl-field input,
  .apply-tpl-field select {
    padding: 7px 10px; font-size: 13px;
    background: #fff; color: #2a2f23;
    border: 1px solid rgba(0,0,0,0.12); border-radius: 7px;
    outline: none; font-family: inherit;
  }
  .apply-tpl-field input:focus,
  .apply-tpl-field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
  .apply-tpl-vars-head {
    margin-top: 6px; padding-top: 10px;
    border-top: 0.5px dashed rgba(0,0,0,0.12);
    font-size: 10.5px; font-weight: 600; color: #6d745c;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .apply-tpl-vars { display: flex; flex-direction: column; gap: 8px; }
  .apply-tpl-foot {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 14px 16px; margin-top: 6px;
    border-top: 0.5px solid rgba(0,0,0,0.08);
    background: rgba(0,0,0,0.02);
  }
  .apply-tpl-btn {
    padding: 7px 16px; font-size: 12.5px; font-weight: 500;
    border-radius: 7px; cursor: pointer; border: 1px solid transparent;
    font-family: inherit;
  }
  .apply-tpl-btn.ghost { background: transparent; color: var(--muted); border-color: rgba(0,0,0,0.12); }
  .apply-tpl-btn.ghost:hover { background: rgba(0,0,0,0.05); }
  .apply-tpl-btn.primary { background: var(--accent); color: #fff; }
  .apply-tpl-btn.primary:hover { background: #6c9648; }
  .macwin.dark .apply-tpl-modal { background: #1f231a; box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3); }
  .macwin.dark .apply-tpl-head,
  .macwin.dark .apply-tpl-foot { border-color: rgba(255,255,255,0.08); }
  .macwin.dark .apply-tpl-foot { background: rgba(255,255,255,0.02); }
  .macwin.dark .apply-tpl-title { color: #ecefdd; }
  .macwin.dark .apply-tpl-sub,
  .macwin.dark .apply-tpl-field > span,
  .macwin.dark .apply-tpl-vars-head { color: #a0a895; }
  .macwin.dark .apply-tpl-vars-head { border-top-color: rgba(255,255,255,0.12); }
  .macwin.dark .apply-tpl-field input,
  .macwin.dark .apply-tpl-field select {
    background: #2a2f23; color: #ecefdd; border-color: rgba(255,255,255,0.12);
  }
  .macwin.dark .apply-tpl-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .macwin.dark .apply-tpl-btn.ghost { color: #c0c8b3; border-color: rgba(255,255,255,0.12); }
  .macwin.dark .apply-tpl-btn.ghost:hover { background: rgba(255,255,255,0.06); }

  /* Template builder — floating right-side panel, non-blocking. */
  .tpl-builder {
    position: fixed; top: 88px; right: 14px; width: 286px;
    max-height: calc(100vh - 110px); overflow: hidden;
    background: rgba(249,246,236,0.97); backdrop-filter: blur(8px);
    border: 0.5px solid rgba(0,0,0,0.1); border-radius: 10px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.15), 0 1px 4px rgba(0,0,0,0.06);
    z-index: 90; display: flex; flex-direction: column;
    transition: width 0.18s ease, max-height 0.18s ease;
  }
  .tpl-builder.collapsed { width: 44px; max-height: 44px; }
  .tpl-builder-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
  }
  .tpl-builder-toggle {
    width: 22px; height: 22px; border: 0; background: transparent;
    cursor: pointer; color: #6d745c; border-radius: 5px; font-size: 13px;
  }
  .tpl-builder-toggle:hover { background: rgba(0,0,0,0.06); color: #2a2f23; }
  .tpl-builder-glyph { font-size: 16px; }
  .tpl-builder-title { flex: 1; font-size: 12.5px; font-weight: 600; color: #2a2f23; letter-spacing: 0.01em; }
  .tpl-builder-close {
    width: 22px; height: 22px; border: 0; background: transparent;
    cursor: pointer; color: #6d745c; font-size: 16px; border-radius: 5px;
  }
  .tpl-builder-close:hover { background: rgba(0,0,0,0.08); color: #2a2f23; }
  .tpl-builder-body { padding: 8px 10px 10px; overflow-y: auto; flex: 1; }
  .tpl-builder-hint { font-size: 10.5px; color: #6d745c; padding: 2px 4px 8px; line-height: 1.45; }
  .tpl-builder-group { margin-bottom: 4px; }
  .tpl-builder-group-head {
    width: 100%; display: flex; align-items: center; gap: 6px;
    padding: 4px 6px; background: transparent; border: 0; cursor: pointer;
    font-size: 11px; font-weight: 600; color: var(--muted); text-align: left;
    text-transform: uppercase; letter-spacing: 0.05em; border-radius: 4px;
  }
  .tpl-builder-group-head:hover { background: rgba(0,0,0,0.04); }
  .tpl-builder-group-chev { display: inline-block; transition: transform 0.12s ease; font-size: 8px; color: #8a9079; width: 8px; }
  .tpl-builder-group.open .tpl-builder-group-chev { transform: rotate(90deg); }
  .tpl-builder-group-name { flex: 1; }
  .tpl-builder-group-count {
    font-size: 9.5px; padding: 1px 6px; border-radius: 8px;
    background: color-mix(in srgb, var(--accent) 12%, transparent); color: #4a6038; font-weight: 600;
  }
  .tpl-builder-chips {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 4px 8px;
  }
  .tpl-chip {
    display: inline-flex; align-items: center; padding: 3px 7px;
    background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-radius: 5px; cursor: grab; user-select: none;
    font-family: ui-monospace, monospace; font-size: 10.5px;
    color: #2a4a18; transition: background 0.1s, transform 0.05s;
  }
  .tpl-chip:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .tpl-chip:active { cursor: grabbing; transform: scale(0.96); }
  .tpl-chip-label { white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .tpl-builder-custom {
    width: 100%; padding: 6px 10px; margin-top: 4px;
    background: transparent; border: 1px dashed color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius: 6px; cursor: pointer;
    font-size: 11.5px; color: #4a6038;
  }
  .tpl-builder-custom:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); border-style: solid; }
  .tpl-builder-section-head {
    padding: 14px 4px 4px; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;
    border-top: 0.5px dashed rgba(0,0,0,0.1); margin-top: 12px;
  }
  .tpl-builder-empty { font-size: 11px; color: #8a9079; padding: 4px; font-style: italic; line-height: 1.4; }
  .tpl-builder-detected { display: flex; flex-direction: column; gap: 3px; padding: 4px 0; }
  .tpl-builder-var {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 6px; background: rgba(0,0,0,0.03); border-radius: 4px;
    font-size: 11px;
  }
  .tpl-builder-var-name { font-family: ui-monospace, monospace; color: #2a2f23; }
  .tpl-builder-var-def { font-size: 10px; color: #6d745c; font-style: italic; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tpl-builder-var-action {
    width: 20px; height: 20px; border: 0; background: transparent;
    cursor: pointer; color: #6d745c; font-size: 11px; border-radius: 3px;
    flex-shrink: 0;
  }
  .tpl-builder-var-action:hover { background: rgba(0,0,0,0.08); color: #2a2f23; }

  .macwin.dark .tpl-builder-var-action { color: #a0a895; }
  .macwin.dark .tpl-builder-var-action:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .tpl-builder-foot { margin-top: 12px; padding-top: 8px; border-top: 0.5px dashed rgba(0,0,0,0.1); }
  .tpl-builder-preview-btn {
    width: 100%; padding: 6px 10px; font-size: 11.5px;
    background: var(--accent); color: #fff; border: 0; border-radius: 6px; cursor: pointer;
    font-weight: 500;
  }
  .tpl-builder-preview-btn:hover { background: #6c9648; }
  .tpl-preview-modal { width: min(640px, 94vw); }
  .tpl-preview-body {
    margin: 0; padding: 14px 16px;
    overflow: auto; max-height: 60vh;
    font-family: ui-monospace, monospace; font-size: 12px;
    background: rgba(0,0,0,0.02); white-space: pre-wrap; word-break: break-word;
    color: #2a2f23;
  }
  .macwin.dark .tpl-builder { background: rgba(31,35,26,0.97); border-color: rgba(255,255,255,0.08); box-shadow: 0 12px 36px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.2); }
  .macwin.dark .tpl-builder-head { border-bottom-color: rgba(255,255,255,0.06); }
  .macwin.dark .tpl-builder-title { color: #ecefdd; }
  .macwin.dark .tpl-builder-toggle,
  .macwin.dark .tpl-builder-close { color: #a0a895; }
  .macwin.dark .tpl-builder-toggle:hover,
  .macwin.dark .tpl-builder-close:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .macwin.dark .tpl-builder-group-head { color: #c0c8b3; }
  .macwin.dark .tpl-builder-group-head:hover { background: rgba(255,255,255,0.05); }
  .macwin.dark .tpl-builder-group-count { background: rgba(150,180,120,0.18); color: #b9d49a; }
  .macwin.dark .tpl-builder-hint,
  .macwin.dark .tpl-builder-empty,
  .macwin.dark .tpl-builder-var-def,
  .macwin.dark .tpl-builder-section-head { color: #9aa093; }
  .macwin.dark .tpl-builder-section-head { border-top-color: rgba(255,255,255,0.08); }
  .macwin.dark .tpl-builder-foot { border-top-color: rgba(255,255,255,0.08); }
  .macwin.dark .tpl-chip { background: rgba(150,180,120,0.12); border-color: rgba(150,180,120,0.3); color: #c5e1a3; }
  .macwin.dark .tpl-chip:hover { background: rgba(150,180,120,0.22); border-color: rgba(150,180,120,0.5); }
  .macwin.dark .tpl-builder-var { background: rgba(255,255,255,0.04); }
  .macwin.dark .tpl-builder-var-name { color: #ecefdd; }
  .macwin.dark .tpl-preview-body { background: rgba(255,255,255,0.04); color: #ecefdd; }

  /* Vaults pane */

  .view-doticon {

  /* Folder navigation submenu (Mover a carpeta). Drills into subfolders

  .sync-dot-btn {

  @keyframes sync-pulse {

  .emoji-picker {

.macwin.is-non-mac .titlebar .presence,

.macwin.is-non-mac .titlebar .winctl-btn {

  }

  /* Drag-and-drop visual cue */
  
  .view-item[draggable="true"] {
